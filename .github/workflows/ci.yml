name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # Real PostgreSQL and Redis, used by the second test run below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chat -d chat_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Test (in-memory database, single instance)
        run: npm test

      - name: Test (real PostgreSQL + Redis, includes two-instance sync)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://chat:chat@localhost:5432/chat_test
          TEST_REDIS_URL: redis://localhost:6379
